name: Connect KVGDS Debug (SPARK-26085)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  connect-kvgds-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Spark
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Ivy and Maven
        uses: actions/cache@v4
        with:
          path: |
            ~/.ivy2/cache
            ~/.m2/repository
            ~/.sbt
          key: spark-${{ runner.os }}-${{ hashFiles('**/build.sbt') }}

      - name: Run SPARK-26085 Connect test
        run: |
          ./build/sbt \
            "connect-client-jvm/testOnly \
             org.apache.spark.sql.connect.KeyValueGroupedDatasetE2ETestSuite \
             -- -z SPARK-26085"
